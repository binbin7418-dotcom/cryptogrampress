name: Build Windows package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyinstaller reportlab
      - name: Build with PyInstaller
        run: pyinstaller cryptogrampress.spec
      - name: Zip the app folder
        run: Compress-Archive -Path dist/CryptogramPress -DestinationPath CryptogramPress-Windows.zip
        shell: pwsh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptogramPress-Windows
          path: CryptogramPress-Windows.zip
